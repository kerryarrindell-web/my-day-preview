<!DOCTYPE html>
<html lang="en-GB">
<head>
  <link rel="stylesheet" href="my-day-v11.css">
<meta charset="utf-8">
<title>My Day</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fdf6f0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My Day">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="favicon.svg"><link rel="alternate icon" href="icon-192.png">

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fdf6f0;--card:#fff;--ink:#3b2f3a;--mute:#8a7a86;--pri:#e0678a;--pri2:#fbe1ea;--sage:#6fb08f;--sage2:#e1f2e9;--line:#f0e3dc;--shadow:0 2px 10px rgba(120,70,90,.10);--inp:#fff;--tip:#fff8e6;--tipink:#7a6120}
body.dark{--bg:#1d1719;--card:#2a2124;--ink:#f3e8ec;--mute:#b7a5ad;--pri:#f08aa8;--pri2:#43232d;--sage:#7cc4a0;--sage2:#21352b;--line:#3a2f33;--shadow:none;--inp:#241c1f;--tip:#3b3220;--tipink:#e8d29a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden;max-width:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-size:18px;line-height:1.4;padding-bottom:calc(92px + env(safe-area-inset-bottom))}
body[data-size=l]{font-size:21px}body[data-size=xl]{font-size:24px}
header{padding:calc(22px + env(safe-area-inset-top)) 18px 8px;display:flex;align-items:flex-start;gap:10px;max-width:640px;margin:0 auto}
header .hd{flex:1;min-width:0}
.logo{width:1.15em;height:1.15em;vertical-align:-.2em}
header h1{margin:0;font-size:1.45em;font-weight:800;line-height:1.2}
header p{margin:2px 0 0;color:var(--mute);font-size:.9em}
.gear{background:var(--card);border:0;border-radius:50%;width:46px;height:46px;font-size:1.2em;box-shadow:var(--shadow);flex:none}
main{padding:8px 14px;max-width:640px;margin:0 auto}
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:16px;margin:12px 0}
.card h2{margin:0 0 10px;font-size:1.05em;font-weight:800;display:flex;align-items:center;gap:8px}
.row{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .txt{flex:1;min-width:0;word-wrap:break-word;cursor:pointer}
.row.done .txt{text-decoration:line-through;color:var(--mute)}
.chk{width:32px;height:32px;border-radius:50%;border:3px solid var(--pri);background:var(--card);flex:none;padding:0;display:grid;place-items:center;color:#fff;font-size:1em;font-weight:800}
.done .chk{background:var(--sage);border-color:var(--sage)}
.x{background:none;border:0;color:var(--mute);opacity:.6;font-size:1.3em;padding:4px 8px;cursor:pointer}
.add{display:flex;gap:8px;margin-top:10px}
input,select,textarea{font:inherit;color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--inp);width:100%;min-width:0}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--pri)}
button{font:inherit;cursor:pointer;color:inherit}
.btn{background:var(--pri);color:#fff;border:0;border-radius:14px;padding:12px 18px;font-weight:800;white-space:nowrap}
body.dark .btn{color:#2a1017}
body.dark .btn.alt{color:var(--pri)}
body.dark .btn.sage{color:var(--sage)}
body.dark .btn.danger{color:#f4a3b8}
.btn.alt{background:var(--pri2);color:var(--pri)}
.btn.sage{background:var(--sage2);color:var(--sage)}
.btn.danger{background:#f6eef1;color:#a2415f}
body.dark .btn.danger{background:#43232d;color:#f4a3b8}
.mic{background:var(--pri2);border:0;border-radius:14px;width:52px;flex:none;font-size:1.2em}
.mic.on{background:var(--pri);animation:p 1s infinite}
@keyframes p{50%{opacity:.55}}
.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);display:flex;box-shadow:0 -2px 14px rgba(120,70,90,.12);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:5}
.tabs button{flex:1;background:none;border:0;padding:8px 2px;color:var(--mute);font-weight:700;font-size:.72em;border-radius:14px}
.tabs button span{display:block;font-size:1.85em;line-height:1.2}
.tabs button.on{color:var(--pri);background:var(--pri2)}
.chips{display:flex;gap:8px;flex-wrap:wrap;overflow-x:visible;padding:4px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:0;background:var(--card);box-shadow:var(--shadow);border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-weight:700;white-space:nowrap;color:var(--ink)}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
body.dark .chip.on{color:#2a1017}
.chip.got{background:var(--sage);color:#fff;border-color:var(--sage)}
.appt{border-left:6px solid var(--pri);padding:6px 0 6px 12px;margin:10px 0}
.appt.today{border-color:var(--sage)}
.appt b{font-size:1.05em}
.meta{color:var(--mute);font-size:.85em}
.badge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.72em;font-weight:800;background:var(--sage2);color:var(--sage);margin-left:6px}
.badge.soon{background:var(--pri2);color:var(--pri)}
.acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.acts a,.acts button{font-size:.85em;padding:8px 14px;border-radius:12px;border:0;font-weight:800;text-decoration:none;display:inline-block}
.a-cal{background:#e8f0fe;color:#1a56c4}
body.dark .a-cal{background:#202c45;color:#9cbcff}
.a-del{background:#f6eef1;color:#a26a7c}
body.dark .a-del{background:#3a2a30;color:#e3a9bb}
.notes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.note{border-radius:6px 6px 18px 6px;padding:14px 12px 12px;min-height:120px;position:relative;box-shadow:2px 4px 8px rgba(0,0,0,.12);transform:rotate(-1deg);font-weight:600;word-wrap:break-word;color:#3b2f3a;cursor:pointer}
.note:nth-child(even){transform:rotate(1.2deg)}
.note .x{position:absolute;top:0;right:0;color:rgba(0,0,0,.4);font-size:1.1em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.empty{color:var(--mute);text-align:center;padding:14px 4px}
label{font-weight:700;font-size:.85em;color:var(--mute);display:block;margin:10px 0 4px}
.tip{background:var(--tip);border-radius:14px;padding:12px 14px;font-size:.85em;color:var(--tipink);margin-top:10px}
.moti{background:linear-gradient(135deg,var(--pri2),var(--sage2))}
.moti .mq{font-size:1.1em;font-weight:700;line-height:1.5;margin:8px 0 2px}
.moti details{margin-top:12px;font-size:.88em}
.moti details a{color:var(--pri);font-weight:800}
.moti details li{margin:6px 0}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.4)}100%{transform:scale(1)}}
@keyframes flash{0%{background:var(--sage2)}100%{background:transparent}}
@keyframes rise{from{transform:translateY(16px) scale(.9);opacity:0}to{transform:none;opacity:1}}
@keyframes cf{from{transform:translate(0,0) rotate(0);opacity:1}to{transform:translate(var(--dx),calc(var(--dy) + 46px)) rotate(var(--r));opacity:0}}
.chk.pop{animation:pop .45s ease;background:var(--sage);border-color:var(--sage)}
.row.flash{animation:flash 1s ease-out;border-radius:12px}
.cf{position:fixed;width:8px;height:8px;border-radius:2px;pointer-events:none;z-index:70;animation:cf .85s ease-out forwards}
#cheer{width:max-content;position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:65;pointer-events:none;max-width:92vw;text-align:center}
#cheer .p2{display:block;background:linear-gradient(135deg,var(--pri),#f29bb5);color:#fff;font-weight:800;padding:12px 20px;border-radius:999px;box-shadow:0 6px 20px rgba(224,103,138,.4);animation:rise .35s ease-out}
#cheer .p2.big{font-size:1.15em;padding:16px 24px}
body.dark #cheer .p2{color:#2a1017}
.wins{font-size:.85em;font-weight:700;color:var(--sage);background:var(--sage2);border-radius:12px;padding:8px 12px;margin:0 0 6px}
@media (prefers-reduced-motion:reduce){.chk.pop,.row.flash,#cheer .p2,.cf{animation:none}}
.sync{font-size:.72em;color:var(--mute);text-align:center;margin:14px 0}
.seg{display:flex;gap:8px}.seg button{flex:1;padding:11px 0;border-radius:14px;border:2px solid var(--line);background:var(--card);font-weight:800}
.seg button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
body.dark .seg button.on{color:#2a1017}
#modalwrap{position:fixed;inset:0;z-index:40}
#modalwrap[hidden]{display:none}
.scrim{position:absolute;inset:0;background:rgba(40,20,30,.5)}
#modal{position:absolute;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;background:var(--bg);border-radius:24px 24px 0 0;max-height:92vh;overflow-y:auto;padding:18px 16px calc(20px + env(safe-area-inset-bottom))}
#modal h2{margin:0 0 6px;font-size:1.15em}
.mbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
#banner{position:fixed;top:calc(8px + env(safe-area-inset-top));left:10px;right:10px;max-width:620px;margin:0 auto;z-index:50;display:flex;flex-direction:column;gap:8px}
.alert{background:#ffd98a;color:#3a2a05;border-radius:18px;padding:12px 14px;box-shadow:0 6px 18px rgba(0,0,0,.28)}
.alert b{display:block;font-size:1.05em}
.alert .acts button{background:rgba(255,255,255,.7);color:#3a2a05}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom));background:#3b2f3a;color:#fff;padding:11px 18px;border-radius:999px;z-index:60;display:flex;gap:14px;align-items:center;font-size:.85em;max-width:90vw}
#toast[hidden]{display:none}
#toast button{background:none;border:0;color:#ffd98a;font-weight:800}
summary{cursor:pointer}

/* ===== Liquid Glass layer ===== */
:root{--glass:rgba(255,255,255,.58);--glass2:rgba(255,255,255,.88);--gedge:rgba(255,255,255,.78);--gshadow:0 8px 28px rgba(120,70,90,.12);--b1:rgba(224,103,138,.26);--b2:rgba(111,176,143,.24);--b3:rgba(242,184,75,.18);--inp:rgba(255,255,255,.72);--spring:cubic-bezier(.34,1.56,.64,1)}
body.dark{--glass:rgba(48,37,41,.55);--glass2:rgba(34,26,29,.9);--gedge:rgba(255,255,255,.14);--gshadow:0 8px 28px rgba(0,0,0,.35);--b1:rgba(240,138,168,.2);--b2:rgba(124,196,160,.16);--b3:rgba(242,184,75,.1);--inp:rgba(36,28,31,.6)}
body{font-family:ui-rounded,"SF Pro Rounded",Nunito,system-ui,sans-serif;padding-bottom:calc(120px + env(safe-area-inset-bottom))}
body::before{content:'';position:fixed;inset:-15%;z-index:-1;pointer-events:none;background:radial-gradient(42% 34% at 12% 8%,var(--b1),transparent 70%),radial-gradient(40% 38% at 92% 28%,var(--b2),transparent 70%),radial-gradient(46% 38% at 28% 96%,var(--b3),transparent 70%);}
@keyframes drift{to{transform:translate3d(3%,-2%,0) scale(1.08)}}
.gear,.tabs,#modal,#toast,header.scrolled{-webkit-backdrop-filter:blur(18px) saturate(170%);backdrop-filter:blur(18px) saturate(170%)}
.card{background:var(--glass2);border:1px solid var(--gedge);box-shadow:var(--gshadow),inset 0 1px 0 rgba(255,255,255,.55)}
.moti{background:linear-gradient(135deg,color-mix(in srgb,var(--pri2) 75%,transparent),color-mix(in srgb,var(--sage2) 75%,transparent))}
.gear{background:var(--glass);border:1px solid var(--gedge);box-shadow:var(--gshadow)}
.chip{background:var(--glass);border:1px solid var(--gedge)}
.chip.on{background:var(--pri);border-color:var(--pri)}.chip.got{background:var(--sage);border-color:var(--sage)}
.seg button{background:var(--glass);border:1px solid var(--gedge)}
.seg button.on{background:var(--pri);border-color:var(--pri)}
.tabs{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto;border-radius:32px;padding:6px;background:var(--glass);border:1px solid var(--gedge);box-shadow:0 10px 34px rgba(120,70,90,.2),inset 0 1px 0 rgba(255,255,255,.7)}
.tabs button{border-radius:26px;transition:background .3s,color .3s,transform .28s var(--spring)}
.tabs button.on{background:color-mix(in srgb,var(--pri) 16%,transparent);box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
#toast{bottom:calc(128px + env(safe-area-inset-bottom))}
#cheer{bottom:calc(180px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:15;transition:background .3s,border-color .3s;border-bottom:1px solid transparent}
header .hd{transform-origin:left center;transition:transform .3s var(--spring)}
header p{transition:opacity .25s}
header.scrolled{background:var(--glass);border-bottom-color:var(--gedge)}
header.scrolled .hd{transform:scale(.8)}
header.scrolled p{opacity:0}
.scrim{-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#modal{background:var(--glass2);border:1px solid var(--gedge);border-bottom:0;border-radius:30px 30px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.7);padding-top:28px;-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%)}
#modal::before{content:'';position:absolute;top:9px;left:50%;width:42px;height:5px;margin-left:-21px;border-radius:3px;background:var(--mute);opacity:.35}
#modalwrap:not([hidden]) #modal{animation:sheetin .5s cubic-bezier(.2,.9,.25,1.05)}
#modalwrap:not([hidden]) .scrim{animation:fadein .3s ease}
#modal.out{animation:sheetout .22s ease-in forwards!important}
#modalwrap.out .scrim{animation:fadeout .22s forwards!important}
@keyframes sheetin{from{transform:translateY(100%)}to{transform:none}}
@keyframes sheetout{to{transform:translateY(100%)}}
@keyframes fadein{from{opacity:0}}
@keyframes fadeout{to{opacity:0}}
.btn,.chip,.pill,.a-cal,.a-del,.mic,.gear,.seg button,.chk,.x,.acts a,.acts button{transition:transform .28s var(--spring),background .25s,box-shadow .25s}
.btn:active,.chip:active,.a-cal:active,.a-del:active,.mic:active,.gear:active,.seg button:active,.acts a:active,.acts button:active{transform:scale(.95)}
.chk:active{transform:scale(.85)}
.btn{box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 4px 12px rgba(224,103,138,.3)}
.btn.alt,.btn.danger,.btn.sage{box-shadow:none}
.row{position:relative;transition:transform .35s var(--spring)}
.row.swr::before,.row.swl::after{position:absolute;top:50%;transform:translateY(-50%);font-weight:800;font-size:.85em;white-space:nowrap}
.row.swr::before{content:'✓ Done';right:100%;margin-right:12px;color:var(--sage)}
.row.swl::after{content:'🗑 Delete';left:100%;margin-left:12px;color:var(--pri)}
.row.swr{background:var(--sage2);border-radius:14px}
.row.swl{background:var(--pri2);border-radius:14px}
@keyframes rise2{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
@keyframes slidein{from{opacity:0;transform:translateX(-26px) scale(.96)}to{opacity:1;transform:none}}
#app.enter>*{animation:rise2 .5s var(--spring) both;animation-delay:calc(var(--i,0)*45ms)}
.row.slidein{animation:slidein .5s var(--spring)}
body.noglass::before{display:none}
body.noglass .card,body.noglass .tabs,body.noglass #modal,body.noglass header.scrolled,body.noglass #toast,body.noglass .gear,body.noglass .scrim{-webkit-backdrop-filter:none;backdrop-filter:none}
body.noglass .card,body.noglass .tabs,body.noglass .gear,body.noglass .chip,body.noglass .seg button,body.noglass header.scrolled{background:var(--card)}
body.noglass #modal{background:var(--bg)}
@media (prefers-reduced-motion:reduce){body::before{animation:none}#modalwrap:not([hidden]) #modal,#modalwrap:not([hidden]) .scrim,#app.enter>*,.row.slidein{animation:none}}

/* v1.3.1: additional shopping lists are visible cards, not hidden offscreen tabs */
.myday-list-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.myday-list-tile{min-width:0;text-align:left;border:1px solid var(--line);border-left:5px solid var(--list-accent);border-radius:17px;background:var(--card);color:var(--ink);padding:14px 12px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);cursor:pointer}
.myday-list-tile strong{overflow-wrap:anywhere;font-size:1em}
.myday-list-tile small{color:var(--mute);font-size:.8em}
.myday-list-icon{font-size:1.5em}.myday-list-open{font-size:.8em;font-weight:700;color:var(--list-accent)}
@media(max-width:330px){.myday-list-grid{grid-template-columns:1fr}}
</style>
</head>
<body data-size="m">
<div id="banner" aria-live="assertive"></div>
<header><div class="hd"><h1 id="hi">Hello <img class="logo" src="favicon.svg" alt=""></h1><p id="dt"></p></div><button class="gear" onclick="openSettings()" aria-label="Settings">⚙️</button></header>
<main id="app"></main>
<nav class="tabs" id="tabs"></nav>
<div id="modalwrap" hidden><div class="scrim" onclick="closeModal()"></div><div id="modal" role="dialog" aria-modal="true"></div></div>
<div id="toast" hidden></div>
<div id="cheer" role="status" aria-live="polite"></div>

<script>
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayStr=()=>ymd(new Date());
const pd=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ymd(d)};
const cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;

const DEF=()=>({lists:[{id:'groc',name:'Groceries',emoji:'🛒',items:[]},{id:'baby',name:'Baby',emoji:'🍼',items:[]},{id:'todo',name:'To do',emoji:'✅',items:[]}],tasks:[],appts:[],notes:[],name:'',custom:[],settings:{size:'m',dark:false,notify:false,cal:'https://calendar.google.com/',babyUrl:'',moti:true,cheer:true},wins:{},notified:{},snooze:{},routines:[{id:'am',name:'Morning',emoji:'🌅',items:[{id:'am1',t:'Take vitamins'},{id:'am2',t:'Breakfast'},{id:'am3',t:'Check today’s list'}]},{id:'pm',name:'Bedtime',emoji:'🌙',items:[{id:'pm1',t:'Lock up'},{id:'pm2',t:'Charge phone'},{id:'pm3',t:'Look at tomorrow'}]}],rlog:{},meals:{}});
const KEY='myday-v1';
let S=DEF(),mem=null;
let animTab=false,lastAdd=null,motiOff=0,motiHelp=false,noteQ='',openRt=null,pendingImg='',editImg='',tab='today',curList='groc',showForm=false,showPast=false,showDone=false,openCat=null,confirmDel=false,noteColor='#fff3a8',lastSnap=null,alerts=[],installEvt=null,syncMsg='Saved on this phone';

/* ---------- storage ---------- */
function norm(o){const d=DEF();const n=Object.assign(d,o||{});n.settings=Object.assign(DEF().settings,(o&&o.settings)||{});
  n.notified=n.notified||{};n.snooze=n.snooze||{};
  const cut=Date.now()-4*864e5;for(const k in n.notified)if(n.notified[k]<cut)delete n.notified[k];
  const old=addDays(todayStr(),-45);
  n.tasks=n.tasks.filter(t=>!(t.done&&!t.rep&&t.date<old));
  n.wins=n.wins||{};for(const k in n.wins)if(k<old)delete n.wins[k];
  n.rlog=n.rlog||{};n.meals=n.meals||{};n.routines=n.routines||DEF().routines;
  for(const k in n.rlog)if(k<old)delete n.rlog[k];
  const oldM=addDays(todayStr(),-14);for(const k in n.meals)if(k<oldM)delete n.meals[k];
  n.tasks.forEach(t=>{if(t.doneOn)for(const k in t.doneOn)if(k<old)delete t.doneOn[k]});
  return n}
function save(){const j=JSON.stringify(S);mem=j;try{localStorage.setItem(KEY,j);syncMsg='Saved on this phone'}catch(e){syncMsg='Not saved — phone storage unavailable. Export a backup now.';console.warn('My Day: local storage write failed',e)}}
(function(){let j=null;try{j=localStorage.getItem(KEY)}catch(e){}if(j){try{S=norm(JSON.parse(j))}catch(e){}}
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}})();
function snap(){lastSnap=JSON.stringify(S)}
function undo(){if(lastSnap){S=norm(JSON.parse(lastSnap));lastSnap=null;$('#toast').hidden=true;save();render()}}
let toastT=null;

function gcal({title,date,time,dur=60,place='',notes=''}){
  let dates;
  if(time){const [h,m]=time.split(':').map(Number);const s=pd(date);s.setHours(h,m);const e=new Date(s.getTime()+dur*60000);
    const f=d=>d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'T'+pad(d.getHours())+pad(d.getMinutes())+'00';dates=f(s)+'/'+f(e)}
  else{const s=pd(date),e=new Date(s.getTime()+864e5);const f=d=>d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate());dates=f(s)+'/'+f(e)}
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(title)+'&dates='+dates+'&details='+encodeURIComponent(notes)+'&location='+encodeURIComponent(place)}
function icsEsc(s){return String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n')}
function icsFor(a){
  const dur=a.dur||60,L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//My Day//EN','BEGIN:VEVENT','UID:'+a.id+'@myday','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z'];
  if(a.time){const s=pd(a.date),p=a.time.split(':');s.setHours(+p[0],+p[1]);const e=new Date(s.getTime()+dur*60000);
    const f=d=>d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'T'+pad(d.getHours())+pad(d.getMinutes())+'00';L.push('DTSTART:'+f(s),'DTEND:'+f(e))}
  else L.push('DTSTART;VALUE=DATE:'+a.date.replace(/-/g,''),'DTEND;VALUE=DATE:'+addDays(a.date,1).replace(/-/g,''));
  L.push('SUMMARY:'+icsEsc(a.title));if(a.place)L.push('LOCATION:'+icsEsc(a.place));if(a.notes)L.push('DESCRIPTION:'+icsEsc(a.notes));
  const r=a.remind==null?60:a.remind;if(r>=0&&a.time)L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Reminder','TRIGGER:-PT'+r+'M','END:VALARM');
  L.push('END:VEVENT','END:VCALENDAR');return L.join('\r\n')}

function fmtDate(d){return pd(d).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})}
function fmtTime(t){if(!t)return'';const [h,m]=t.split(':').map(Number);return (h%12||12)+':'+pad(m)+(h<12?' am':' pm')}
function daysUntil(d){return Math.round((pd(d)-pd(todayStr()))/864e5)}
function when(d){const n=daysUntil(d);return n===0?'<span class="badge">Today</span>':n===1?'<span class="badge soon">Tomorrow</span>':n<0?'':n<=7?`<span class="badge soon">In ${n} days</span>`:''}
function upcoming(){return S.appts.filter(a=>daysUntil(a.date)>=0).sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')))}
const REP={'':'Doesn’t repeat',daily:'Every day',weekdays:'Weekdays only',weekly:'Every week',monthly:'Every month'};
function occursOn(t,ds){
  if(!t.rep)return t.date===ds;
  const s=t.date;if(ds<s)return false;const d=pd(ds),sd=pd(s);
  if(t.rep==='daily')return true;
  if(t.rep==='weekdays'){const w=d.getDay();return w>0&&w<6}
  if(t.rep==='weekly')return d.getDay()===sd.getDay();
  if(t.rep==='monthly'){const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();return d.getDate()===Math.min(sd.getDate(),last)}
  return false}
const isDone=(t,ds)=>t.rep?!!(t.doneOn&&t.doneOn[ds]):!!t.done;
const byTime=(a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99');
function tasksFor(ds){
  return S.tasks.filter(t=>t.rep?occursOn(t,ds):(t.date===ds||(t.date<ds&&!t.done))).sort((a,b)=>(isDone(a,ds)-isDone(b,ds))||byTime(a,b))}

/* ---------- quick-add parsing ("Call GP at 3pm", "Bins tomorrow") ---------- */
const DAYN=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
function parseQuick(raw){
  let s=' '+raw.trim()+' ',date=null,time=null,rep='',m;
  if((m=s.match(/\s(every ?day|daily)\s/i))){rep='daily';s=s.replace(m[0],' ')}
  else if((m=s.match(/\s(every week|weekly)\s/i))){rep='weekly';s=s.replace(m[0],' ')}
  else if((m=s.match(/\s(every month|monthly)\s/i))){rep='monthly';s=s.replace(m[0],' ')}
  else if((m=s.match(/\s(on )?weekdays\s/i))){rep='weekdays';s=s.replace(m[0],' ')}
  if((m=s.match(/\stomorrow\s/i))){date=addDays(todayStr(),1);s=s.replace(m[0],' ')}
  else if((m=s.match(/\stoday\s/i))){date=todayStr();s=s.replace(m[0],' ')}
  else if((m=s.match(/\s(?:on |next )?(sunday|monday|tuesday|wednesday|thursday|friday|saturday)\s/i))){
    const want=DAYN.indexOf(m[1].toLowerCase());let d=pd(todayStr());do{d.setDate(d.getDate()+1)}while(d.getDay()!==want);date=ymd(d);s=s.replace(m[0],' ')}
  if((m=s.match(/\s(?:at )?(\d{1,2})(?::(\d{2}))?\s?(am|pm)\s/i))&&+m[1]<=12){let h=+m[1]%12;if(m[3].toLowerCase()==='pm')h+=12;time=pad(h)+':'+(m[2]||'00');s=s.replace(m[0],' ')}
  else if((m=s.match(/\sat (\d{1,2}):(\d{2})\s/i))&&+m[1]<24){time=pad(+m[1])+':'+m[2];s=s.replace(m[0],' ')}
  let text=s.replace(/\s+/g,' ').trim();if(!text)text=raw.trim();
  return{t:cap(text),date,time,rep}}

function validBackup(p){return p&&typeof p==='object'&&!Array.isArray(p)&&Array.isArray(p.lists)&&p.lists.every(l=>l&&typeof l==='object'&&typeof l.name==='string'&&Array.isArray(l.items))&&Array.isArray(p.tasks)&&p.tasks.every(t=>t&&typeof t==='object')&&Array.isArray(p.appts)&&Array.isArray(p.notes)&&(!p.settings||(typeof p.settings==='object'&&!Array.isArray(p.settings)))&&(!p.routines||Array.isArray(p.routines))}

function bnOk(k){alerts=alerts.filter(a=>a.key!==k);renderBanner()}
function bnDone(k){const a=alerts.find(x=>x.key===k);if(a&&a.tid){const t=S.tasks.find(x=>x.id===a.tid);if(t&&!isDone(t,a.ds))toggleTask(a.tid,a.ds)}bnOk(k)}
function bnSnooze(k){S.snooze[k]=Date.now()+600000;delete S.notified[k];save();bnOk(k);toast('Snoozed for 10 minutes')}
function fire(key,title,body,tid,ds){
  S.notified[key]=Date.now();delete S.snooze[key];save();alerts=alerts.filter(a=>a.key!==key);alerts.push({key,title,body,tid,ds});renderBanner();
  try{if(navigator.vibrate)navigator.vibrate([200,100,200])}catch(e){}
  if(S.settings.notify&&'Notification' in window&&Notification.permission==='granted'){const o={body,tag:key,icon:'icon-192.png'};
    try{if(navigator.serviceWorker&&navigator.serviceWorker.ready)navigator.serviceWorker.ready.then(r=>r.showNotification(title,o)).catch(()=>{try{new Notification(title,o)}catch(e){}});else new Notification(title,o)}catch(e){}}}
function tick(){
  const now=Date.now(),ds=todayStr();
  S.tasks.forEach(t=>{if(!t.time||!occursOn(t,ds)||isDone(t,ds))return;const key='t'+t.id+ds;
    if(S.notified[key]||(S.snooze[key]&&now<S.snooze[key]))return;
    const p=t.time.split(':'),at=new Date();at.setHours(+p[0],+p[1],0,0);
    if(now>=at.getTime()&&now-at.getTime()<8*36e5)fire(key,'⏰ '+t.t,fmtTime(t.time)+' today',t.id,ds)});
  S.appts.forEach(a=>{const r=a.remind==null?60:a.remind;if(!a.time||r<0)return;const key='a'+a.id+a.date+'r'+r;
    if(S.notified[key]||(S.snooze[key]&&now<S.snooze[key]))return;
    const p=a.time.split(':'),st=pd(a.date);st.setHours(+p[0],+p[1],0,0);const at=st.getTime()-r*60000;
    if(now>=at&&now<st.getTime()+36e5)fire(key,'📅 '+a.title,(r?'In '+(r>=1440?'a day':r>=60?(r/60)+(r>60?' hours':' hour'):r+' minutes')+' · ':'Now · ')+fmtTime(a.time)+(a.place?' · '+a.place:''),null,ds)})}

/* Me Time: additive, private local-only journal; never removes S.notes. */
const ME_TEMPLATES={
  rest:['I managed to get some rest','I took a shower and felt refreshed','I ate a proper meal','I drank some water','I listened to my body and slowed down','I asked for help when I needed it'],
  baby:['I enjoyed cuddles with my baby','I soothed my baby','I made it through a difficult night','I enjoyed a bonding moment','I noticed something new about my baby','I felt a little more confident as a mum'],

  everyday:['I managed a household task','I prepared something to eat','I got through a busy day','I finished something I had put off','I made someone smile','I gave myself permission to leave things undone']};

const ME_ADVICE={
 rest:['If someone can watch baby for a few minutes, try lying down without feeling you must finish a chore first.','A short quiet break still counts. Put your phone aside and rest somewhere comfortable.','Choose one task that can wait today. Rest is a real need, not a reward.','If sleep was broken last night, ask someone you trust to take over for a little while so you can recharge.','Try a calm, screen-free pause with a warm drink or soothing music.'],
 food:['Keep a simple snack within reach for busy feeding or cuddling days.','If cooking feels like too much, a sandwich or something easy is perfectly fine.','Try to sit down for a meal when you can, even if the housework waits.','Ask someone to prepare a snack or meal for you; accepting help is a win.','Pair a meal with a little break and eat at your own pace.'],

function meAdvice(need){const arr=ME_ADVICE[need];if(!arr)return '';const d=todayStr();let n=0;for(const ch of d)n=(n*31+ch.charCodeAt(0))>>>0;return arr[n%arr.length]}

 if(meSection==='moments')return `${top}${back}<div class="card md131-panel purple"><h2>📸 My Day in Moments</h2><p>What did you do today? A cuddle, a walk, a nap — everything counts.</p><input id="meMomentInput" maxlength="240" placeholder="e.g. Enjoyed a peaceful morning"><button class="btn md131-action" onclick="meAdd('moments')">+ Add my moment</button>${meEntries('moments')}</div>`;

const TABS=[['today','🌸','Today'],['lists','🛒','Lists'],['appts','📅','Appts'],['me','💗','Me Time']];
function render(){
  if(tab==='notes')tab='today';
  const act=document.activeElement&&document.activeElement.id;const vals={};
  document.querySelectorAll('#app input,#app textarea').forEach(e=>{if(e.id&&e.value&&e.type!=='date'&&e.type!=='time')vals[e.id]=e.value});
  /* keep the task day/time/repeat the user picked (and the panel open) so a re-render can't flip a PM time back */
  const draft={},ndet=document.getElementById('ndet'),detOpen=!!(ndet&&ndet.open);
  ['ntd','ntt','ntr'].forEach(id=>{const e=document.getElementById(id);if(e&&(id==='ntr'?e.value:e.value!==e.defaultValue))draft[id]=e.value});
  document.body.dataset.size=S.settings.size;document.body.classList.toggle('dark',!!S.settings.dark);
  $('#hi').innerHTML=greeting();
  $('#dt').textContent=new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
  $('#app').innerHTML=({today:vToday,lists:vLists,appts:vAppts,me:vMeTime})[tab]()+`<div class="sync">${syncMsg}</div>`;
  /* Visual-only category colours: no changes to storage, tasks or notes. */
  const toneOf=(heading)=>{
    const h=heading.toLowerCase();
    if(/shopping|grocer|new list|quick add|baby list|list/.test(h))return 'peach';
    if(/appointment|upcoming|coming up|calendar/.test(h))return 'lavender';
    if(/routine|meal plan|meals|breakfast/.test(h))return 'mint';
    if(/tomorrow|sticky|note|reminder/.test(h))return 'berry';
    if(/complete|progress|wins|celebrat/.test(h))return 'honey';
    if(/task|to do|things to do|today|priority/.test(h))return 'rose';
    return 'lavender';
  };
  $('#app').querySelectorAll('.card:not(.md131-panel):not(.md131-feature)').forEach(card=>{
    const title=card.querySelector('h2');
    if(title){card.classList.add('md131-colour-card');card.dataset.tone=toneOf(title.textContent||'');}
  });
  document.body.dataset.section=tab;

  Object.keys(vals).forEach(k=>{const e=document.getElementById(k);if(e)e.value=vals[k]});
  Object.keys(draft).forEach(k=>{const e=document.getElementById(k);if(e)e.value=draft[k]});
  if(detOpen){const d=document.getElementById('ndet');if(d)d.open=true}
  document.body.classList.toggle('noglass',S.settings.glass===false||autoNoGlass);
  const appEl=$('#app');appEl.classList.remove('enter');
  if(animTab){animTab=false}
  if(lastAdd){const b=document.querySelector('[data-pop="'+lastAdd+'"]'),r=b&&b.closest('.row');if(r)r.classList.add('slidein');lastAdd=null}
  if(act){const e=document.getElementById(act);if(e&&e.focus&&e.id.indexOf('mic-')!==0){e.focus();if(e.type==='text'&&e.setSelectionRange){try{e.setSelectionRange(e.value.length,e.value.length)}catch(x){}}}}
  $('#tabs').innerHTML=TABS.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="tab='${t[0]}';animTab=true;window.scrollTo(0,0);render()"><span>${t[1]}</span>${t[2]}</button>`).join('')}


/* ---------- gestures: swipe rows, drag sheets, collapsing header ---------- */
(function(){
  const app=document.getElementById('app');let sw=null;
  app.addEventListener('touchstart',e=>{const row=e.target.closest('.row[data-sw]');
    if(!row||e.touches.length>1||e.target.closest('input,textarea,select')){sw=null;return}
    const t=e.touches[0];sw={row,x:t.clientX,y:t.clientY,dx:0,lock:null,spec:row.dataset.sw.split(':')}},{passive:true});
  app.addEventListener('touchmove',e=>{if(!sw)return;const t=e.touches[0],dx=t.clientX-sw.x,dy=t.clientY-sw.y;
    if(!sw.lock&&(Math.abs(dx)>10||Math.abs(dy)>10))sw.lock=Math.abs(dx)>Math.abs(dy)*1.5?'h':'v';
    if(sw.lock!=='h'){if(sw.lock==='v')sw=null;return}
    if(e.cancelable)e.preventDefault();
    let d=dx;if(d<0&&sw.spec[0]==='r')d=0;
    sw.dx=d;const r=sw.row;r.style.transition='none';r.style.transform='translateX('+(d*.85)+'px)';
    r.classList.toggle('swr',d>12);r.classList.toggle('swl',d<-12)},{passive:false});
  const end=()=>{if(!sw)return;const{row,dx,spec}=sw;sw=null;
    row.style.transition='transform .32s cubic-bezier(.34,1.56,.64,1),opacity .2s';
    if(Math.abs(dx)<96){row.style.transform='';row.classList.remove('swr','swl');return}
    try{if(navigator.vibrate)navigator.vibrate(12)}catch(e){}
    const kind=spec[0],id=spec[1],ds=spec[2];
    if(dx>0){row.style.transform='';row.classList.remove('swr','swl');
      if(kind==='t')toggleTask(id,ds);else if(kind==='i')toggleItem(id);else if(kind==='r')rtTick(id)}
    else{row.style.transform='translateX(-110%)';row.style.opacity='0';
      setTimeout(()=>{if(kind==='t')delTask(id);else if(kind==='i')delItem(id)},190)}};
  app.addEventListener('touchend',end);app.addEventListener('touchcancel',end);
  const m=document.getElementById('modal');let d=null;
  m.addEventListener('touchstart',e=>{const t=e.touches[0],r=m.getBoundingClientRect();if(t.clientY-r.top>48||m.scrollTop>0){d=null;return}d={y:t.clientY,dy:0}},{passive:true});
  m.addEventListener('touchmove',e=>{if(!d)return;const dy=e.touches[0].clientY-d.y;if(dy<0){d=null;return}d.dy=dy;m.style.animation='none';m.style.transition='none';m.style.transform='translateY('+dy+'px)';if(e.cancelable)e.preventDefault()},{passive:false});
  m.addEventListener('touchend',()=>{if(!d)return;const dy=d.dy;d=null;
    if(dy>110){m.style.transition='transform .22s ease-in';m.style.transform='translateY(100%)';clearTimeout(modalT);modalT=setTimeout(hideModal,210)}
    else{m.style.transition='transform .35s cubic-bezier(.34,1.56,.64,1)';m.style.transform='';setTimeout(()=>{m.style.transition='';m.style.animation=''},360)}});
  const hd=document.querySelector('header');
  addEventListener('scroll',()=>{const on=hd.classList.contains('scrolled');if(!on&&scrollY>40)hd.classList.add('scrolled');else if(on&&scrollY<12)hd.classList.remove('scrolled')},{passive:true});
})();
